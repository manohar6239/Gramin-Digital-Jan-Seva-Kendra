<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gramin Digital Jan Seva Kendra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Devanagari",sans-serif;background:#f6faf7;color:#173b26}
.top{background:#075e54;color:#fff;padding:9px 5%;text-align:center}
header{background:#fff;padding:16px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;box-shadow:0 2px 10px #0001}
.logo{width:300px;max-width:90%;max-height:100px;object-fit:contain}
nav{background:#063b22;text-align:center}nav a{display:inline-block;color:#fff;text-decoration:none;padding:14px 18px;font-weight:bold}
.hero{text-align:center;padding:65px 5%;background:linear-gradient(135deg,#fff,#e8f6ed)}
.hero h1{font-size:clamp(34px,6vw,58px);margin:0;color:#075e54}.hero h1 span{color:#f97316}
.hero p{max-width:750px;margin:18px auto;line-height:1.7;font-size:18px}
.btn{display:inline-block;border:0;border-radius:8px;padding:12px 20px;margin:7px 4px;font-weight:bold;text-decoration:none;cursor:pointer}.green{background:#075e54;color:#fff}.orange{background:#f97316;color:#fff}
section{padding:55px 5%}.title{text-align:center;color:#075e54}
.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}
.card{background:#fff;border-radius:15px;padding:24px;text-align:center;box-shadow:0 4px 16px #0001;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}
.icon{font-size:40px}.card h3{color:#075e54}.card small{color:#666}
.about{text-align:center;background:#eaf7ee}.about p{max-width:850px;margin:auto;line-height:1.8;font-size:18px}
.contact{max-width:700px;margin:auto;background:#fff;padding:25px;border-radius:15px;box-shadow:0 4px 16px #0001}.info{font-size:18px;line-height:1.7;margin:10px 0}
footer{background:#063b22;color:#fff;text-align:center;padding:28px}
.editBtn{position:fixed;right:15px;bottom:15px;border:0;border-radius:30px;background:#f97316;color:#fff;padding:13px 18px;font-weight:bold;z-index:900}
#modal,#editor{display:none;position:fixed;inset:0;background:#0008;z-index:2000;padding:18px;overflow:auto}
.box{background:#fff;width:min(650px,100%);margin:30px auto;padding:25px;border-radius:17px;position:relative}.close{position:absolute;right:12px;top:10px;border:0;border-radius:50%;font-size:22px;width:35px;height:35px}
.option{display:block;background:#f5f8f5;border:1px solid #ddd;border-radius:9px;padding:12px;margin:9px 0;cursor:pointer}.option input{width:19px;height:19px;vertical-align:middle;margin-right:8px}
.field{margin:12px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #bbb;border-radius:7px;font-size:16px}
</style>
</head>
<body>
<div class="top">📍 <span id="topAddress"></span> | 📞 <span id="topPhone"></span></div>
<header>
<img class="logo" src="shop-logo.png" alt="Shop Logo">
<div><a class="btn green" id="call1">📞 Call</a><a class="btn orange" id="wa1" target="_blank">💬 WhatsApp</a></div>
</header>
<nav><a href="#home">होम</a><a href="#services">सेवाएँ</a><a href="#about">हमारे बारे में</a><a href="#contact">संपर्क</a></nav>

<section class="hero" id="home">
<h1><span id="name"></span><br><span id="tag"></span></h1>
<p id="intro"></p>
<a class="btn green" href="#services">हमारी सेवाएँ</a>
</section>

<section id="services"><h2 class="title">हमारी सेवाएँ</h2><div class="grid" id="servicesGrid"></div></section>

<section class="about" id="about"><h2 class="title">हमारे बारे में</h2><p id="about"></p></section>

<section id="contact"><h2 class="title">संपर्क करें</h2><div class="contact">
<div class="info">📍 <b>पता:</b> <span id="address"></span></div>
<div class="info">📞 <b>मोबाइल:</b> <span id="phone"></span></div>
<div class="info">🕘 <b>समय:</b> <span id="hours"></span></div>
<a class="btn green" id="call2">📞 कॉल करें</a><a class="btn orange" id="wa2" target="_blank">💬 WhatsApp</a>
</div></section>
<footer><h3 id="footer"></h3><p>आपकी सेवा, हमारा संकल्प</p></footer>

<button class="editBtn" onclick="openEditor()">⚙️ Edit Website</button>

<div id="modal"><div class="box">
<button class="close" onclick="closeModal()">×</button>
<div id="modalIcon" class="icon"></div><h2 id="modalTitle"></h2><p id="modalDesc"></p>
<div id="options"></div>
<button class="btn orange" onclick="sendSelected()">💬 चुनी हुई Service WhatsApp करें</button>
</div></div>

<div id="editor"><div class="box">
<button class="close" onclick="closeEditor()">×</button><h2>⚙️ Website Edit</h2>
<div class="field"><label>दुकान का नाम</label><input id="eName"></div>
<div class="field"><label>Tagline</label><input id="eTag"></div>
<div class="field"><label>मोबाइल</label><input id="ePhone"></div>
<div class="field"><label>पता</label><textarea id="eAddress" rows="3"></textarea></div>
<div class="field"><label>समय</label><input id="eHours"></div>
<div class="field"><label>Intro</label><textarea id="eIntro" rows="3"></textarea></div>
<div class="field"><label>About</label><textarea id="eAbout" rows="3"></textarea></div>
<p><b>Services:</b> नीचे format में हर line एक service रखें: Emoji | नाम | विवरण</p>
<div class="field"><textarea id="eServices" rows="10"></textarea></div>
<button class="btn green" onclick="save()">💾 Save</button>
</div></div>

<script>
const defaults={
name:"Gramin Digital Jan Seva Kendra",
tag:"सभी सरकारी एवं डिजिटल सेवाएँ अब आपके गाँव में",
phone:"7087449392",
address:"Bhuvahi Sonaura Khurd, Sonaura Buzurg, Campierganj, Gorakhpur, Uttar Pradesh",
hours:"सुबह 9:00 बजे से शाम 7:00 बजे तक",
intro:"ऑनलाइन फॉर्म, डिजिटल सेवाओं और अन्य सुविधाओं के लिए सरल एवं भरोसेमंद सहायता प्राप्त करें।",
about:"Gramin Digital Jan Seva Kendra का उद्देश्य ग्रामीण क्षेत्र के लोगों तक जरूरी डिजिटल और ऑनलाइन सेवाओं को आसान तरीके से पहुँचाना है।",
services:[
["🪪","Aadhaar Service","आधार से संबंधित सेवाएँ"],
["💳","PAN Card Service","पैन कार्ड से संबंधित सेवाएँ"],
["📄","Online Form","ऑनलाइन फॉर्म भरने की सहायता"],
["💡","Bill Payment","बिल भुगतान की सहायता"],
["💰","Money Transfer","उपलब्ध डिजिटल बैंकिंग सहायता"],
["🖨️","Print & Scan","प्रिंट और स्कैन सुविधा"],
["📷","Photo Service","फोटो एवं दस्तावेज़ फोटो सेवा"],
["💻","Other Digital Services","अन्य डिजिटल सेवाएँ"]
]};
const choices={
"Aadhaar Service":["आधार में नाम सुधार","आधार में मोबाइल नंबर अपडेट","आधार में पता सुधार","आधार में जन्मतिथि सुधार","आधार डाउनलोड / प्रिंट"],
"PAN Card Service":["नया PAN Card आवेदन","PAN Card में सुधार","PAN डाउनलोड / प्रिंट"],
"Online Form":["सरकारी फॉर्म भरना","ऑनलाइन रजिस्ट्रेशन","दस्तावेज़ अपलोड","फॉर्म प्रिंट"],
"Bill Payment":["बिजली बिल भुगतान","मोबाइल रिचार्ज","पानी का बिल","अन्य बिल भुगतान"],
"Money Transfer":["पैसे भेजना","लेन-देन सहायता","रसीद / ट्रांजैक्शन सहायता"],
"Print & Scan":["Black & White Print","Color Print","दस्तावेज़ Scan","PDF बनाना"],
"Photo Service":["पासपोर्ट साइज फोटो","फोटो प्रिंट","डिजिटल फोटो"],
"Other Digital Services":["ऑनलाइन आवेदन","दस्तावेज़ संबंधी कार्य","डिजिटल कॉपी","अन्य डिजिटल सेवा"]
};
let data=JSON.parse(localStorage.getItem("gdjskData"))||defaults;
let selectedService="";

function tel(){return "tel:"+data.phone.replace(/\D/g,"")}
function wa(){return "https://wa.me/91"+data.phone.replace(/\D/g,"")}
function render(){
document.getElementById("name").textContent=data.name;document.getElementById("footer").textContent=data.name;
document.getElementById("tag").textContent=data.tag;document.getElementById("intro").textContent=data.intro;
document.getElementById("about").textContent=data.about;document.getElementById("address").textContent=data.address;
document.getElementById("topAddress").textContent=data.address;document.getElementById("phone").textContent=data.phone;
document.getElementById("topPhone").textContent=data.phone;document.getElementById("hours").textContent=data.hours;
["call1","call2"].forEach(id=>document.getElementById(id).href=tel());
["wa1","wa2"].forEach(id=>document.getElementById(id).href=wa());
document.getElementById("servicesGrid").innerHTML=data.services.map((s,i)=>`<div class="card" onclick="openService(${i})"><div class="icon">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><small>👆 क्लिक करके service चुनें</small></div>`).join("");
}
function openService(i){
selectedService=data.services[i][1];
document.getElementById("modalIcon").textContent=data.services[i][0];
document.getElementById("modalTitle").textContent=selectedService;
document.getElementById("modalDesc").textContent="ग्राहक अपनी जरूरत वाली service पर tick करें:";

const optionSets=[
["आधार में नाम सुधार","आधार में मोबाइल नंबर अपडेट","आधार में पता सुधार","आधार में जन्मतिथि सुधार","आधार डाउनलोड / प्रिंट"],
["नया PAN Card आवेदन","PAN Card में सुधार","PAN डाउनलोड / प्रिंट"],
["सरकारी फॉर्म भरना","ऑनलाइन रजिस्ट्रेशन","दस्तावेज़ अपलोड","फॉर्म प्रिंट"],
["बिजली बिल भुगतान","मोबाइल रिचार्ज","पानी का बिल","अन्य बिल भुगतान"],
["पैसे भेजना","लेन-देन सहायता","रसीद / ट्रांजैक्शन सहायता"],
["Black & White Print","Color Print","दस्तावेज़ Scan","PDF बनाना"],
["पासपोर्ट साइज फोटो","फोटो प्रिंट","डिजिटल फोटो"],
["ऑनलाइन आवेदन","दस्तावेज़ संबंधी कार्य","डिजिटल कॉपी","अन्य डिजिटल सेवा"]
];

const list=optionSets[i] || [data.services[i][2]];
document.getElementById("options").innerHTML=list.map(x=>
`<label class="option"><input type="checkbox" class="serviceCheck" value="${x.replace(/"/g,"&quot;")}"> ${x}</label>`
).join("");
document.getElementById("modal").style.display="block";
}
function sendSelected(){
let checked=[...document.querySelectorAll(".serviceCheck:checked")].map(x=>x.value);
if(!checked.length){alert("कृपया कम से कम एक service पर tick करें।");return}
let msg="नमस्ते, मुझे Gramin Digital Jan Seva Kendra से "+selectedService+" में मदद चाहिए।\n\nमेरी चुनी हुई service:\n- "+checked.join("\n- ");
window.open(wa()+"?text="+encodeURIComponent(msg),"_blank");
}
function closeModal(){document.getElementById("modal").style.display="none"}
function openEditor(){
eName.value=data.name;eTag.value=data.tag;ePhone.value=data.phone;eAddress.value=data.address;eHours.value=data.hours;eIntro.value=data.intro;eAbout.value=data.about;
eServices.value=data.services.map(s=>s.join(" | ")).join("\n");editor.style.display="block";
}
function save(){
data={name:eName.value||defaults.name,tag:eTag.value||defaults.tag,phone:ePhone.value||defaults.phone,address:eAddress.value||defaults.address,hours:eHours.value||defaults.hours,intro:eIntro.value||defaults.intro,about:eAbout.value||defaults.about,services:eServices.value.split("\n").filter(x=>x.trim()).map(x=>{let p=x.split("|").map(y=>y.trim());return[p[0]||"📌",p[1]||"Service",p.slice(2).join(" | ")||"सेवा"]})};
localStorage.setItem("gdjskData",JSON.stringify(data));render();closeEditor();alert("जानकारी Save हो गई!");
}
function closeEditor(){editor.style.display="none"}
render();
</script>
</body>
</html>
